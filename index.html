<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Train2Earn - Solana Platform</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      /* X Broadcast Pop-out styles */
      #broadcast-popout {
        display: none;
        position: fixed;
        bottom: 24px;
        right: 24px;
        z-index: 9999;
        width: 360px;
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 8px 32px rgba(0,0,0,0.18);
        overflow: hidden;
        transition: transform 0.2s ease, opacity 0.2s ease;
      }
      #broadcast-popout.open {
        display: block;
        animation: slideUp 0.3s ease;
      }
      @keyframes slideUp {
        from { transform: translateY(20px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      #broadcast-toggle {
        position: fixed;
        bottom: 24px;
        right: 24px;
        z-index: 9998;
        padding: 12px 20px;
        background: #1d9bf0;
        color: #fff;
        border: none;
        border-radius: 40px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 4px 12px rgba(29,155,240,0.4);
        transition: opacity 0.2s;
      }
      #broadcast-toggle:hover {
        opacity: 0.85;
      }
      #broadcast-toggle.hidden {
        display: none;
      }
      #broadcast-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px;
        background: #1d9bf0;
        color: #fff;
        font-weight: 600;
        font-size: 14px;
      }
      #broadcast-close {
        background: none;
        border: none;
        color: #fff;
        font-size: 20px;
        cursor: pointer;
        padding: 0 4px;
        line-height: 1;
      }
      #broadcast-body {
        padding: 12px;
      }
      .twitter-broadcast {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <!-- X Broadcast Pop-out Toggle Button -->
    <button id="broadcast-toggle" onclick="toggleBroadcast()">▶ Watch Live</button>

    <!-- X Broadcast Pop-out -->
    <div id="broadcast-popout">
      <div id="broadcast-header">
        <span>🔴 Live Broadcast</span>
        <button id="broadcast-close" onclick="toggleBroadcast()">&times;</button>
      </div>
      <div id="broadcast-body">
        <blockquote class="twitter-broadcast" data-broadcast-id="1rGmqqvEjZnGy">
          <a href="https://x.com/i/broadcasts/1rGmqqvEjZnGy">Broadcast</a>
        </blockquote>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- X Widgets Script + Pop-out toggle -->
    <script async src="https://platform.x.com/widgets.js" charset="utf-8"></script>
    <script>
      function toggleBroadcast() {
        const popout = document.getElementById('broadcast-popout');
        const toggle = document.getElementById('broadcast-toggle');
        const isOpen = popout.classList.toggle('open');
        toggle.classList.toggle('hidden', isOpen);
        // Re-render Twitter widgets when popout opens
        if (isOpen && window.twttr && window.twttr.widgets) {
          window.twttr.widgets.load();
        }
      }
    </script>
  </body>
</html>
