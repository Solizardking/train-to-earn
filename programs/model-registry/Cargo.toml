[package]
name = "clawd-model-registry"
version = "0.2.0"
description = "CLAWD AI model identity registry — 8004-inspired SVM program with Pinata + Hugging Face"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "model_registry"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build"]
default = []

[dependencies]
anchor-lang = "0.30.1"
# Uncomment after confirming your Light Protocol fork tag:
# light-sdk = { git = "https://github.com/your-org/light-protocol", tag = "v0.x.x", features = ["zk-compression"] }
