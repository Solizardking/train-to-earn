name: Bug Report
description: Something is broken
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Thanks for taking the time to report this!"

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Frontend (React)
        - Backend (Express server)
        - Smart contract (Anchor program)
        - Arweave / IPFS storage
        - CLAWD agent / xAI
        - DAO voting
        - Model registry
        - Other
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        - OS: macOS 14.x / Ubuntu 22.04
        - Node.js: 20.x
        - Browser: Chrome 124
        - Wallet: Phantom 24.x
