name: Feature Request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to accomplish?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Model registry
        - CLAWD token rewards
        - DAO governance
        - Arweave / IPFS storage
        - xAI file agent
        - Smart contracts
        - Developer tooling
        - Documentation
        - Other
    validations:
      required: true
